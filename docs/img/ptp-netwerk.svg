<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
    <marker id="pijl-grijs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6f80"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#0f1720"/>

  <text x="40" y="52" fill="#e6edf3" font-size="25" font-weight="600">PTP op je eigen netwerk</text>
  <text x="40" y="78" fill="#8b9bab" font-size="14">één klok geeft de tijd uit, alles wat eraan hangt loopt mee · IEEE 1588</text>

  <!-- grootmeester -->
  <rect x="40" y="112" width="322" height="286" rx="14" fill="#16202b" stroke="#2a3b4d" stroke-width="1.5"/>
  <text x="62" y="144" fill="#e6edf3" font-size="16" font-weight="600">Proxmox-host</text>
  <text x="62" y="165" fill="#8b9bab" font-size="12.5">192.168.1.100 · grootmeester</text>

  <rect x="62" y="182" width="278" height="44" rx="9" fill="#1b2735" stroke="#33475c"/>
  <text x="78" y="200" fill="#e6edf3" font-size="13">systeemklok (UTC)</text>
  <text x="78" y="217" fill="#8b9bab" font-size="11.5">op tijd gehouden door NTP / chrony</text>

  <line x1="201" y1="226" x2="201" y2="252" stroke="#5c6f80" stroke-width="1.6" marker-end="url(#pijl-grijs)"/>
  <text x="214" y="245" fill="#8b9bab" font-size="11">phc2sys</text>

  <rect x="62" y="254" width="278" height="44" rx="9" fill="#1b2735" stroke="#33475c"/>
  <text x="78" y="272" fill="#e6edf3" font-size="13">klok van de netwerkkaart</text>
  <text x="78" y="289" fill="#8b9bab" font-size="11.5">/dev/ptp0 — Intel I350 (igb)</text>

  <line x1="201" y1="298" x2="201" y2="322" stroke="#5c6f80" stroke-width="1.6" marker-end="url(#pijl-grijs)"/>

  <rect x="62" y="326" width="278" height="52" rx="9" fill="#16324a" stroke="#4a90d9"/>
  <text x="78" y="347" fill="#cfe4ff" font-size="13" font-weight="600">ptp4l — zendt de tijd uit</text>
  <text x="78" y="364" fill="#9dc2ea" font-size="11.5">elke seconde Announce, 8× per seconde Sync</text>

  <!-- schakelaar -->
  <rect x="432" y="216" width="150" height="82" rx="12" fill="#16202b" stroke="#2a3b4d" stroke-width="1.5"/>
  <text x="507" y="250" fill="#e6edf3" font-size="13.5" text-anchor="middle">schakelaar</text>
  <text x="507" y="270" fill="#8b9bab" font-size="11.5" text-anchor="middle">liefst PTP-transparant</text>

  <line x1="362" y1="352" x2="428" y2="286" stroke="#4a90d9" stroke-width="2" marker-end="url(#pijl)"/>
  <text x="372" y="404" fill="#4a90d9" font-size="11.5">domein 0 · L2</text>

  <!-- clients -->
  <g>
    <rect x="662" y="104" width="300" height="66" rx="10" fill="#16202b" stroke="#2a3b4d" stroke-width="1.5"/>
    <text x="682" y="131" fill="#e6edf3" font-size="13.5">Linux-machine of VM</text>
    <text x="682" y="152" fill="#8b9bab" font-size="11.5">hardware-tijdstempels · eigen kaartklok</text>

    <rect x="662" y="196" width="300" height="66" rx="10" fill="#16202b" stroke="#2a3b4d" stroke-width="1.5"/>
    <text x="682" y="223" fill="#e6edf3" font-size="13.5">LXC-container</text>
    <text x="682" y="244" fill="#8b9bab" font-size="11.5">software-tijdstempels · milliseconden</text>

    <rect x="662" y="288" width="300" height="66" rx="10" fill="#16202b" stroke="#2a3b4d" stroke-width="1.5"/>
    <text x="682" y="315" fill="#e6edf3" font-size="13.5">media-apparatuur</text>
    <text x="682" y="336" fill="#8b9bab" font-size="11.5">Dante · AES67 · converters</text>

    <rect x="662" y="380" width="300" height="58" rx="10" fill="#16202b" stroke="#3a3427" stroke-width="1.5"/>
    <text x="682" y="405" fill="#e6edf3" font-size="13.5">Windows / macOS</text>
    <text x="682" y="425" fill="#8b9bab" font-size="11.5">beperkt of niet mogelijk</text>
  </g>

  <line x1="582" y1="240" x2="658" y2="140" stroke="#4a90d9" stroke-width="2" marker-end="url(#pijl)"/>
  <line x1="582" y1="254" x2="658" y2="230" stroke="#4a90d9" stroke-width="2" marker-end="url(#pijl)"/>
  <line x1="582" y1="268" x2="658" y2="318" stroke="#4a90d9" stroke-width="2" marker-end="url(#pijl)"/>
  <line x1="582" y1="282" x2="658" y2="404" stroke="#5c6f80" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#pijl-grijs)"/>

  <text x="40" y="448" fill="#5c6f80" font-size="12">wat je nodig hebt: één netwerkkaart die tijdstempels in hardware zet — of software-tijdstempels als tussenweg</text>
</svg>
